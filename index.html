
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simulation de transaction</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07172e;color:white;font-family:Arial,sans-serif;padding:25px}
main{max-width:480px;margin:35px auto;background:#102744;padding:25px;border-radius:18px}
h1{text-align:center;color:#e6bd65;font-size:26px}
label{display:block;margin-top:16px;margin-bottom:7px}
input,select,button{width:100%;padding:14px;border-radius:9px;font-size:16px}
input,select{border:1px solid #b4c2d4;background:white;color:#172b46}
button{margin-top:25px;background:#d8ad58;color:#08182e;border:0;font-weight:bold}
small{display:block;text-align:center;margin:15px;color:#b7c5d5}
#resultat{text-align:center;margin-top:25px}
.progress{height:14px;background:#34465e;border-radius:20px;overflow:hidden;margin:18px 0}
#barre{height:100%;width:0;background:#e6bd65;transition:width .1s linear}
.erreur{color:#ff9e9e;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Simulation de transaction</h1>
<form id="formulaire">
<label>Nom</label>
<input id="nom" required placeholder="Votre nom">
<label>Prénom</label>
<input required placeholder="Votre prénom">
<label>Date</label>
<input type="date" required>
<label>Pays</label>
<select required>
<option value="">Sélectionnez votre pays</option>
<option>🇭🇹 Haïti</option>
<option>🇨🇲 Cameroun</option>
<option>🇫🇷 France</option>
<option>🇺🇸 États-Unis</option>
<option>🇨🇦 Canada</option>
<option>🇩🇴 République dominicaine</option>
</select>
<label>Montant à recevoir (HTG)</label>

<input
  id="montant"
  type="number"
  min="60000"
  max="1100000"
  required
  placeholder="60 000 à 1 100 000"
>

<button type="submit" id="envoyer">Envoyer</button>
</form>
<div id="resultat" role="status" aria-live="polite"></div>
</main>
<script>
const form=document.getElementById("formulaire");
const resultat=document.getElementById("resultat");
const bouton=document.getElementById("envoyer");
let intervalle;
form.addEventListener("submit",function(e){
 e.preventDefault();
 clearInterval(intervalle);
 bouton.disabled=true;
 document.getElementById("montant").readOnly = true;
 let progression=1;
 resultat.innerHTML=`
 <p>Transaction en cours : <strong id="pourcentage">1 %</strong></p>
 <div class="progress"><div id="barre"></div></div>`;
 const texte=document.getElementById("pourcentage");
 const barre=document.getElementById("barre");
 barre.style.width="1%";
 intervalle=setInterval(()=>{
  progression++;
  texte.textContent=progression+" %";
  barre.style.width=progression+"%";
  if(progression>=99){
   clearInterval(intervalle);
  resultat.innerHTML = `
  <p><strong>Simulation terminée à 99 %</strong></p>
  <p>Veuillez contacter le service client pour la suite de la démonstration.</p>
  <small>Aucun paiement ni gain confirmé.</small>
`;
    
setTimeout(() => {
  resultat.innerHTML = `
    <h3>🔒 Déverrouillage de la simulation</h3>
    <p>Entrez le code à 4 chiffres pour terminer la démonstration.</p>
    <input
      id="codeSecurite"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="Code à 4 chiffres"
    >
    <button type="button" id="debloquer">
      Déverrouiller
    </button>
    <p id="messageCode"></p>
  `;
  document.getElementById("debloquer").addEventListener("click", () => {
    const code = document.getElementById("codeSecurite").value;
    const message = document.getElementById("messageCode");

    if (code === "2005") {
      resultat.innerHTML = `
     
<h3>✅ Finalisation de la simulation effectuée</h3>
<p>Votre première étape de vérification est terminée.</p>
<p>Vous allez maintenant accéder à la deuxième étape de démonstration.</p>
<small>Simulation uniquement — aucun gain ni transfert réel confirmé.</small>
`;
      
resultat.innerHTML += `
  <h3>🔐 Deuxième étape de vérification</h3>
  <p>Entrez le deuxième code pour terminer la simulation.</p>
  <input id="codeDeux" type="password"
         inputmode="numeric" maxlength="4"
         placeholder="Deuxième code">
  <button id="validerDeux">Valider</button>
  <p id="messageDeux"></p>
`;

document.getElementById("validerDeux").onclick = () => {
  const codeDeux = document.getElementById("codeDeux").value;
  const messageDeux = document.getElementById("messageDeux");

  if (codeDeux === "1967") {
    resultat.innerHTML = `
      <h3>✅ Simulation terminée</h3>
      <p>Les deux étapes de vérification ont été validées.</p>
      <p>Ceci est une démonstration fictive.</p>
      <small>Aucun paiement ni transfert réel effectué.</small>
    `;
  } else {
    messageDeux.textContent = "Deuxième code incorrect.";
  }
};

    } else {
      message.textContent = "Code incorrect. Veuillez réessayer.";
      message.className = "erreur";
    }
  });
}, 60000);


   bouton.disabled=false;
  }
 },10000/98);
});
</script>
</body>
</html>
