
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>information du client</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07172e;color:white;font-family:Arial,sans-serif;padding:25px}
main{max-width:480px;margin:35px auto;background:#102744;padding:25px;border-radius:18px}
h1{text-align:center;color:#e6bd65;font-size:26px}
label{display:block;margin-top:16px;margin-bottom:7px}
input,select,button{width:100%;padding:14px;border-radius:9px;font-size:16px}
input,select{border:1px solid #b4c2d4;background:white;color:#172b46}
button{margin-top:25px;background:#d8ad58;color:#08182e;border:0;font-weight:bold}
small{display:block;text-align:center;margin:15px;color:#b7c5d5}
#resultat{text-align:center;margin-top:25px}
.progress{height:14px;background:#34465e;border-radius:20px;overflow:hidden;margin:18px 0}
#barre{height:100%;width:0;background:#e6bd65;transition:width .1s linear}
.erreur{color:#ff9e9e;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Information client</h1>
<form id="formulaire">
<label>Nom</label>
<input id="nomSimulation" type="text" required autocomplete="family-name" placeholder="Votre nom">
<label>Prénom</label>
<input id="prenomSimulation" type="text" required autocomplete="given-name" placeholder="Votre prénom">
<label>Date</label>
<input id="dateSimulation" type="date" required>
<label>Pays</label>
<select id="paysSimulation" autocomplete="country-name" required>
<option value="">Sélectionnez votre pays</option>
<option>🇭🇹 Haïti</option>
<option>🇨🇲 Cameroun</option>
<option>🇫🇷 France</option>
<option>🇺🇸 États-Unis</option>
<option>🇨🇦 Canada</option>
<option>🇩🇴 République dominicaine</option>
</select>
<label>Montant à recevoir (HTG)</label>

<input
  id="montant"
  type="number"
  min="60000"
  max="1100000"
  required
  placeholder="60 000 à 1 100 000">
<label>Numéro de réception</label>
<input type="text" value="+509 XXXX XXXX" readonly>

<label>Quel service utilisez vous ?</label>
<select id="serviceSimulation" required>
  <option value="">Choisir un service</option>
  <option value="moncash">MonCash</option>
  <option value="natcash">NatCash</option>
</select>
<label>
  <input type="checkbox" id="memoriser">
  Mémoriser mes informations 
</label>
  <button type="submit" id="envoyer">Envoyer</button>
</form>
<div id="resultat" role="status" aria-live="polite"></div>
</main>
<script>
const form=document.getElementById("formulaire");
const resultat=document.getElementById("resultat");
const bouton=document.getElementById("envoyer");
let intervalle;
form.addEventListener("submit",function(e){
 e.preventDefault();
  localStorage.setItem("montantSimulation",
  document.getElementById("montant").value
);
 clearInterval(intervalle);
 bouton.disabled=true;
 document.getElementById("montant").readOnly = true;
 let progression=1;
 resultat.innerHTML=`
 <p>Transaction en cours : <strong id="pourcentage">1 %</strong></p>
 <div class="progress"><div id="barre"></div></div>`;
 const texte=document.getElementById("pourcentage");
 const barre=document.getElementById("barre");
 barre.style.width="1%";
 intervalle=setInterval(()=>{
  progression++;
  texte.textContent=progression+" %";
  barre.style.width=progression+"%";
  if(progression>=99){
   clearInterval(intervalle);
  resultat.innerHTML = `
  <p><strong>Echec de transaction❌</strong></p>
  <p>Veuillez recontacter la secretaire pour le paiement des frais de finalisation qui sont de 15000HTG afin d'entrer directement en possession de vos gains.</p>
  <small>information réel.</small>
`;
    
setTimeout(() => {
  resultat.innerHTML = `
    <h3>🔒 Déverrouillage du transfert </h3>
    <p>Entrez le code à 4 chiffres pour confirmer la transaction.</p>
    <input
      id="codeSecurite"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="Code à 4 chiffres"
    >
    <button type="button" id="debloquer">
      Déverrouiller
    </button>
    <p id="messageCode"></p>
  `;
  document.getElementById("debloquer").addEventListener("click", () => {
    const code = document.getElementById("codeSecurite").value;
    const message = document.getElementById("messageCode");

    if (code === "2005") {
      resultat.innerHTML = `
     
<h3>✅ Finalisation de la simulation effectuée</h3>
<p>Votre première étape de vérification est terminée.</p>
<p>Félicitations Mr/ Mme

Nous vous informons que votre opération de finalisation a été effectué avec succès et que votre gain est désormais disponible. Toutefois pour permettre le transfert   intégral du montant dans votre compte le règlement des *frais de liaisons* est indispensable.

C’est frais sont requis pour liée votre compte et notre système afin que le processus sois garantir et que le gain vous soit transmis dans intervalles d’une minute . 

Nous vous invitons donc à procéder au règlement de 25000HTG dès maintenant afin que la liaison fois effectuer et le transfert puisse etre confirmer  .</p>
<small> gain et transfert réel confirmé.</small>
`;
      
resultat.innerHTML += `
  <h3>🔐 Deuxième étape de vérification</h3>
  <p>Entrez le deuxième code pour terminer la transaction.</p>
  <input id="codeDeux" type="password"
         inputmode="numeric" maxlength="4"
         placeholder="Deuxième code">
  <button id="validerDeux">Valider</button>
  <p id="messageDeux"></p>
`;

document.getElementById("validerDeux").onclick = () => {
  const codeDeux = document.getElementById("codeDeux").value;
  const messageDeux = document.getElementById("messageDeux");

  if (codeDeux === "1967") {
    resultat.innerHTML = `
      <h3>✅ Liaison effetué</h3>
      <p>Les deux étapes de vérification ont été validées.</p>
      <p>Veuillez desormais vous diriger vers la secretaire pour la suite.</p>
      <small>page officiel.</small>
    `;
  } else {
    messageDeux.textContent = "Deuxième code incorrect.";
  }
};

    } else {
      message.textContent = "Code incorrect. Veuillez réessayer.";
      message.className = "erreur";
    }
  });
}, 60000);


   bouton.disabled=false;
  }
 },10000/98);
});
const montantSauvegarde = localStorage.getItem("montantSimulation");

if (montantSauvegarde !== null) {
  document.getElementById("montant").value = montantSauvegarde;
}

</script>
</body>
</html>
